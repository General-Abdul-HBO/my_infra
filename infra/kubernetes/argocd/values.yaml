# Helm values for ArgoCD (chart argo/argo-cd), installed by
# infra/ansible/argocd-bootstrap.yml. Re-run that playbook after editing.

configs:
  cm:
    # How often ArgoCD polls Git for changes. With a GitHub webhook (added with
    # CI/CD later) changes are picked up instantly instead.
    timeout.reconciliation: 180s

    # Lets an Application report the health of the Applications it creates.
    # Without it, sync waves in the app-of-apps would not wait for e.g. the
    # load balancer controller to be Healthy before deploying the example app.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  params:
    # The UI is reached through `kubectl port-forward`, which already tunnels
    # over the authenticated Kubernetes API.
    server.insecure: false

# SSO (Dex) and notifications aren't used yet - fewer pods on small nodes.
dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }
