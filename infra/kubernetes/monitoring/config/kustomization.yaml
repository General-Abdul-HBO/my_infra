# Turns plain files into ConfigMaps that Grafana's sidecar picks up by label.
# Edit the JSON/YAML files, push, and ArgoCD + the sidecar reload Grafana.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true # the sidecar watches by label; stable names are simpler

configMapGenerator:
  - name: grafana-dashboards-example-app
    files:
      - dashboards/example-app.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Applications

  - name: grafana-datasource-cloudwatch
    files:
      - datasources/cloudwatch.yaml
    options:
      labels:
        grafana_datasource: "1"
