# Default StorageClass: encrypted gp3 EBS volumes, provisioned by the EBS CSI
# driver add-on. (EKS no longer marks its old gp2 class as default.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Create the volume in the AZ where the pod actually lands (EBS is per-AZ).
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# Volume is deleted with its PVC. Use Retain for data you can't lose.
reclaimPolicy: Delete
