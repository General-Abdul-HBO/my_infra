# The one public entry point: an internet-facing ALB (created by the AWS Load
# Balancer Controller) in the PUBLIC subnets, sending traffic to the Istio
# ingress gateway pods' IPs in the PRIVATE subnets.
#
#   internet -> ALB -> istio-ingressgateway (Envoy) --mTLS--> app sidecar -> app
#
# Find its address:  kubectl get ingress public -n istio-ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: istio-ingress
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: devops-lab-public
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Health-check the gateway itself (Envoy's readiness endpoint on the
    # status port), not an app behind it - one unhealthy app shouldn't take
    # the whole entry point out of the ALB. The controller also opens this
    # port in the security group.
    alb.ingress.kubernetes.io/healthcheck-port: "15021"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/tags: Project=devops-lab,ManagedBy=aws-load-balancer-controller
    # Lock the ALB down to your own IP while experimenting (recommended):
    # alb.ingress.kubernetes.io/inbound-cidrs: 203.0.113.10/32
    #
    # HTTPS, once you have a domain + ACM certificate:
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/...
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  defaultBackend:
    service:
      name: istio-ingressgateway
      port:
        number: 80
