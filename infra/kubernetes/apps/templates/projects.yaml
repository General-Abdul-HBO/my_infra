# AppProjects are ArgoCD's guard rails: which repos an Application may pull
# from and where it may deploy.
#
# platform: cluster-wide infrastructure, owned by the platform/infra team.
# apps:     application workloads - may only deploy into their own namespaces
#           and can't create cluster-wide resources (except their Namespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster add-ons and shared infrastructure
  sourceRepos:
    - {{ .Values.repoURL }}
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/metrics-server
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Application workloads
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: example-app
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
