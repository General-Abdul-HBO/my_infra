apiVersion: v1
kind: Service
metadata:
  name: example-app
  labels:
    app.kubernetes.io/name: example-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: example-app
  ports:
    # appProtocol tells Istio how to handle each port. "http" = full L7
    # features: routing, retries, per-request metrics, access logs.
    - name: http # app traffic - the Istio ingress gateway routes here (virtualservice.yaml)
      port: 80
      targetPort: http
      appProtocol: http
    - name: management # actuator - Prometheus scrapes this (servicemonitor.yaml)
      port: 8081
      targetPort: management
      appProtocol: http
