apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  labels:
    app.kubernetes.io/name: example-app
spec:
  # No `replicas:` on purpose - the HorizontalPodAutoscaler (hpa.yaml) owns the
  # replica count. If Git also set it, ArgoCD and the HPA would fight.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: example-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the current capacity during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-app
    spec:
      # Restricted Pod Security: non-root, no privilege escalation, no Linux
      # capabilities, default seccomp profile, read-only root filesystem.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across availability zones (and nodes), so losing one
      # AZ doesn't take the app down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: example-app
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: example-app
      terminationGracePeriodSeconds: 45
      containers:
        - name: example-app
          image: example-app # replaced by kustomization.yaml `images:`
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: example-app-config
          resources:
            # requests = what the scheduler reserves; limits = hard ceiling.
            # No CPU limit: CPU limits cause throttling; requests already
            # guarantee a fair share. Memory limit stops a leak taking the node.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          # startupProbe gives the JVM time to boot before liveness kicks in.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30 # up to 150s to start
          # liveness: "is the process stuck?" -> restart the container
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          # readiness: "can it take traffic right now?" -> add/remove from Service
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Keep serving for a few seconds after termination starts, while the
            # ALB finishes deregistering this pod - avoids 502s during rollouts.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # Tomcat needs a writable temp dir
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
