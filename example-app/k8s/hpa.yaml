# Scale between 2 and 6 pods to keep the APP container's average CPU around
# 70% of its request (250m). Needs metrics-server (installed by ArgoCD).
#
# ContainerResource (not Resource): each pod also runs Istio's Envoy sidecar.
# A plain "Resource" metric would average app + sidecar together, so a busy
# proxy or an idle app would skew scaling decisions.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: example-app
  labels:
    app.kubernetes.io/name: example-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: example-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: example-app
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # wait 5 min before removing pods
