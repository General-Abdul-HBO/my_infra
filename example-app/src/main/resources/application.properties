spring.application.name=example-app

# --- App settings (overridden per environment by the Kubernetes ConfigMap) ---
app.greeting=Hello
app.environment=local

# --- Web server ---
server.port=8080
# Finish in-flight requests before shutting down (rolling updates, scale-in).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Actuator on a separate port (8081) ---
# The ALB only routes to 8080, so /actuator/* is never exposed publicly.
# Prometheus and the kubelet probes reach 8081 inside the cluster.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Also serve /livez and /readyz on the MAIN port (8080), for the ALB health check.
management.endpoint.health.probes.add-additional-paths=true
management.info.build.enabled=true

# --- Metrics ---
management.metrics.tags.application=${spring.application.name}
# Publish histogram buckets so Prometheus can compute p95/p99 latency.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
